<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Kaitlyn's Aesthetic Study Site</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="card" id="day">
            <h4>Today is:</h4>
            <h2 id="cal"></h2>
        </div>
        <div class="card" id="calculator" class="small">
            <h2>Calculator:</h2>
            <input aria-label="calc" id="calc">
            <br>
            <div id="numbers">
                <button class="num" onclick="appendNumber('1')">1</button>
                <button class="num" onclick="appendNumber('2')">2</button>
                <button class="num" onclick="appendNumber('3')">3</button>
                <button class="num" onclick="appendOperation('+')">+</button>
                <button class="num" onclick="appendNumber('4')">4</button>
                <button class="num" onclick="appendNumber('5')">5</button>
                <button class="num" onclick="appendNumber('6')">6</button>
                <button class="num" onclick="appendOperation('-')">-</button>
                <button class="num" onclick="appendNumber('7')">7</button>
                <button class="num" onclick="appendNumber('8')">8</button>
                <button class="num" onclick="appendNumber('9')"> 9</button>
                <button class="num" onclick="appendOperation('*')">*</button>
                <button class="num" onclick="appendDecimal()">.</button>
                <button class="num" onclick="appendNumber('0')">0</button>
                <button class="num" onclick="appendOperation('/')">/</button>
                <button class="num" onclick="appendOperation('**')">^</button>
                <button id="equals" onClick="calculate()">=</button>
                <button id="clear">Clear</button>
            </div>
        </div>
        <div class="card" id="timer">
            <h2>Pomodoro</h2>
            <h1>25:00</h1>            
            <div id="timer-btns">
                <button id="focus">Focus</button>
                <button id="shortB">Short Break</button>
                <button id="longB">Long Break</button>
            </div>
        </div>
        <div id="playlist" class="card">
            <h2>Playlist</h2>
            <div id="mood-selector">
                <input aria-label="Link your own (Spotify) playlist here!" type="text" id="playlink" name="playlink" placeholder="Link your own (Spotify) playlist here!">
                <button id="link-btn">Submit</button>
            </div>
            <iframe title="playlist-placeholder" id="playlist-placeholder" data-testid="embed-iframe" src="https://open.spotify.com/embed/playlist/3AycYlV02HCBcN9YeLeKUB" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <div id="notes" class="card">
            <div id="eugh">
                <h2>Notes:</h2>
                <button id="export">Export as a Text File</button>
            </div>
            <textarea aria-label="write" id="notes-val"></textarea>
        </div>
            <div id="todo" class="card">
            <h2>To-Do List</h2>
            <div id="tdip">
                <input aria-label="todo" type="text" id="list-input">
                <button id="tdl-btn">Add to To-Do List</button>
            </div>
            <ul id="tdl-list"></ul>
        </div>
        <div class="card" id="motivation">
            <button class="imgsel" id="nextbtn"><-</button>
            <img alt="rhjklc" src="/assets/todayimake.jpg" id="imgy">
            <button class="imgsel" id="prevbtn">-></button>
            
        </div>
        <div class="card">
            <h3>thx for using my site!</h3>
        </div>
        
    <script src="app.js"></script>
    </body>
</html>
